<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="850" height="260">
  <defs>
    <clipPath id="frame">
      <rect width="850" height="260" rx="12" />
    </clipPath>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#161b22" stroke-width="1" />
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="scan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#e6edf3" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 56px; font-weight: 800; fill: #f0f6fc; letter-spacing: -2px; }
    .alias { font-size: 56px; font-weight: 300; fill: #6e7681; letter-spacing: -2px; }
    .tag { font-size: 12px; fill: #8b949e; letter-spacing: 3px; }
    .hud { font-size: 11px; fill: #484f58; }
    .hud-bright { font-size: 11px; fill: #8b949e; }

    .scanline { animation: sweep 4.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .cursor { animation: blink 1s step-end infinite; }
    .ring-spin { transform-origin: 740px 130px; animation: spin 28s linear infinite; }
    .ring-rev { transform-origin: 740px 130px; animation: spin 18s linear infinite reverse; }

    @keyframes sweep {
      0% { transform: translateX(-300px); }
      100% { transform: translateX(900px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="850" height="260" fill="#090c10" />
    <rect width="850" height="260" fill="url(#grid)" />
    <circle cx="740" cy="130" r="160" fill="url(#glow)" />

    
    <rect x="0" y="0" width="280" height="1.5" fill="url(#scan)" class="scanline" />

    
    <circle cx="740" cy="130" r="78" fill="none" stroke="#21262d" stroke-width="1" stroke-dasharray="4 6" class="ring-spin" />
    <circle cx="740" cy="130" r="52" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="18 8 2 8" class="ring-rev" />
    <circle cx="740" cy="130" r="3" fill="#8b949e" class="pulse" />
    <line x1="645" y1="130" x2="835" y2="130" stroke="#161b22" stroke-width="1" />
    <line x1="740" y1="35" x2="740" y2="225" stroke="#161b22" stroke-width="1" />

    
    <circle cx="44" cy="36" r="3.5" fill="#f0f6fc" class="pulse" />
    <text x="58" y="40" class="mono hud-bright">ROOT@ZENNITH</text>
    <text x="165" y="40" class="mono hud">// 0x7FFF5FBFF8C0</text>
    <text x="806" y="40" text-anchor="end" class="mono hud">ARCH: X86_64 · STD: C11</text>

    
    <text x="42" y="138" class="sans title">Vthienn<tspan class="alias"> / Zennith</tspan><tspan fill="#f0f6fc" font-weight="300" class="cursor">_</tspan></text>

    
    <line x1="44" y1="168" x2="480" y2="168" stroke="#21262d" stroke-width="1" />
    <text x="44" y="196" class="mono tag">PURE C  ·  MANUAL MEMORY  ·  ZERO OVERHEAD</text>
    <text x="44" y="226" class="mono hud">[STATUS: ONLINE]   [GC: NONE]   [ABSTRACTION: MINIMAL]</text>
  </g>

  <rect x="0.5" y="0.5" width="849" height="259" rx="12" fill="none" stroke="#21262d" stroke-width="1" />
</svg>
